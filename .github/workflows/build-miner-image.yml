# Build and publish the slim next-gen miner image to ghcr.io.
#
# Install at .github/workflows/build-miner-image.yml
#
# AFTER THE FIRST SUCCESSFUL RUN the package must be made PUBLIC, or vast.ai
# cannot pull it:
#   github.com/users/<owner>/packages/container/htk-miner-ng/settings
#   -> Danger Zone -> Change visibility -> Public
#
# The tag is pinned to v1 on purpose. Every distinct tag is a separate host-side
# image cache entry; bumping it makes every vast host cold again. Bump only when
# the BAKED DEPENDENCIES change -- miner source changes are fetched at boot and
# need no rebuild.
name: build miner image

on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/build-miner-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # OCI repository names must be lowercase, and the GitHub owner is
      # "Ifonlywe". github.repository_owner preserves that capital I, which
      # buildx rejects outright.
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/htk-miner-ng:v1

      - name: report compressed size
        run: |
          IMG=ghcr.io/${{ steps.vars.outputs.owner }}/htk-miner-ng:v1
          docker manifest inspect "$IMG" > m.json || exit 0
          python3 - <<'PY'
          import json
          m = json.load(open("m.json"))
          total = sum(l["size"] for l in m.get("layers", []))
          print(f"compressed image size: {total/1e6:.0f} MB")
          PY

      # A GPU-less smoke test: the image must at least import cupy and report a
      # coherent "no CUDA device" error rather than a missing-module traceback.
      # Catches a broken wheel set before any rig pays to pull it.
      - name: import smoke test
        run: |
          docker run --rm ghcr.io/${{ steps.vars.outputs.owner }}/htk-miner-ng:v1 \
            python3 -c "
          import cupy, numpy, requests
          print('cupy', cupy.__version__, '| numpy', numpy.__version__)
          from cupy.cuda import nvrtc
          print('nvrtc binding present:', bool(nvrtc))
          try:
              n = cupy.cuda.runtime.getDeviceCount()
              print('devices:', n)
          except Exception as e:
              print('no GPU here as expected:', type(e).__name__)
          "
